name: Bug Report
description: Report a problem with the Booking Headless API
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please do **not** use this
        form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include request method/path, request body, and relevant response.
      placeholder: |
        1. POST /appointments with body { ... }
        2. Observe response ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      render: shell

  - type: input
    id: rust-version
    attributes:
      label: Rust version
      placeholder: "rustc --version output"
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. local docker-compose, staging, production"
    validations:
      required: false
